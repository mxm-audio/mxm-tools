[workspace]
resolver = "3"
members = [
    "apps/mxm-listener-hud",
    "crates/dsp-lab",
    "crates/mxm-listening",
    "crates/mxm-room-ir",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"        # the GUI floor; crates that do not need it override downward
license = "GPL-3.0-or-later"
authors = ["mxm"]
repository = "https://github.com/mxm-audio/mxm-tools"

[workspace.dependencies]
# Pinned exactly, as in every MXM repository; Cargo.lock is committed. Own crates by path,
# the kit's from mxm-kit v0.3.0, another product's from its repository at v0.1.0.
egui = "=0.36.1"
mxm-audio-file = { git = "https://github.com/mxm-audio/mxm-kit", branch = "main" }
mxm-audio-file-decode = { git = "https://github.com/mxm-audio/mxm-kit", branch = "main" }
mxm-classic-verb-fit = { git = "https://github.com/mxm-audio/mxm-classic-verb", branch = "main" }
mxm-creative-sampler-dsp = { git = "https://github.com/mxm-audio/mxm-creative-sampler", branch = "main" }
mxm-listening = { path = "crates/mxm-listening" }
mxm-measure = { git = "https://github.com/mxm-audio/mxm-kit", branch = "main" }
mxm-mono-01-dsp = { git = "https://github.com/mxm-audio/mxm-mono-01", branch = "main" }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.dev.package.mxm-measure]
opt-level = 3

[profile.dev.package.mxm-listening]
opt-level = 3

[profile.dev.package.mxm-room-ir]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
