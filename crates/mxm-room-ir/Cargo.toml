[package]
name = "mxm-room-ir"
description = "Offline room-acoustics simulation that writes impulse-response WAVs. Ships nothing into a plugin."
version.workspace = true
edition.workspace = true
# No GUI: it does NOT inherit the 1.95 GUI floor; every dependency builds on 1.87.
rust-version = "1.87"
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The collection's shared code (architecture audit O6): the generator and the WAV reader. The
# writer stays this crate's (`src/wav.rs`).
mxm-audio-file-decode.workspace = true
mxm-rng.workspace = true
